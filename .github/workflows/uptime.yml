# Checks the hosted lab site every 15 minutes. A failed run emails whoever GitHub notifies about
# workflow failures (the person who last changed this file, by default).
name: Uptime
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/uptime.mjs https://rondel.lab.spikinglabs.com/ || (sleep 60 && node scripts/uptime.mjs https://rondel.lab.spikinglabs.com/)
