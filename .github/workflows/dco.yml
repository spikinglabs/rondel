# Every commit in a pull request needs a "Signed-off-by:" line (git commit -s); see CONTRIBUTING.md.
name: DCO

on: pull_request

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Add a sign-off with: git commit --amend -s (or git rebase --signoff $BASE) and push again. See CONTRIBUTING.md."
            exit 1
          fi
          echo "Every commit is signed off."
