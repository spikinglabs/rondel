# Tests every pull request (and the Docker setup in deploy/example/). Every merge to main goes to the staging
# site; a version tag (v0.24.0) goes to the hosted lab site, after the same tests and a browser check of staging,
# and publishes the Docker image.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e

  # The self-hosting path: deploy/example/ with Docker Compose, checked like a real site.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose -f deploy/example/docker-compose.yml up -d --build --wait --wait-timeout 120 || (docker compose -f deploy/example/docker-compose.yml logs && exit 1)
      - run: for i in $(seq 30); do curl -sf http://localhost:8787/api/health && break; sleep 2; done
      - run: node scripts/uptime.mjs http://localhost:8787/
      - run: curl -sf http://localhost:8787/ | grep -q '"Example Corp IT"'
      - run: curl -sf http://localhost:8787/templates/weekly-team-meeting.yaml | grep -q 'Weekly team meeting'
      - if: always()
        run: docker compose -f deploy/example/docker-compose.yml logs

  staging:
    needs: [test, docker]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy-staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lab:staging
      # The first check right after a deploy can time out while the site updates.
      - run: npm run lab:check-staging || (sleep 20 && npm run lab:check-staging)

  lab:
    needs: staging
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    concurrency: deploy-lab
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lab:deploy
      - run: npm run lab:check-live || (sleep 20 && npm run lab:check-live)

  # The Docker image for self-hosting, on each release: ghcr.io/spikinglabs/rondel:<version>, :<major.minor>, :latest.
  image:
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=Rondel
            org.opencontainers.image.description=Retrospectives and everyday meetings, end-to-end encrypted
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
